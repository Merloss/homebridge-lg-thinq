# Homebridge with the patched LG ThinQ plugin, for Dokploy's "Compose" service.
#
# IMPORTANT - HomeKit needs to be on the same physical network as your iPhone.
# HomeKit discovers bridges over mDNS/Bonjour, which does not cross routers or
# the internet. If the machine running Dokploy is a cloud VPS, your phone will
# never find this bridge. It has to run on a server on your home LAN (a NAS, a
# mini PC, a Pi), or you need an L2 VPN with an mDNS reflector between them.
#
# network_mode: host is required for the same reason - Docker's default bridge
# network does not forward the multicast traffic HomeKit relies on.

services:
  homebridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Istanbul
      # The Homebridge UI listens here. With host networking this is a port on
      # the host itself, so make sure nothing else is using it.
      HOMEBRIDGE_CONFIG_UI_PORT: 8581
    volumes:
      # Config, accessory cache, installed plugins, persisted LG tokens and MQTT
      # certificates. Losing this means re-pairing the bridge in the Home app.
      #
      # The mount point is /homebridge, not /var/lib/homebridge. The latter is a
      # symlink the image creates at startup; mounting over it stops that
      # symlink from ever being created.
      #
      # Replace this named volume with your existing path if you already run
      # Homebridge, e.g.  - /srv/homebridge:/homebridge
      - homebridge-data:/homebridge

volumes:
  homebridge-data:
